name: Continuous Integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-javascript:
    name: JavaScript Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: yarn

      - name: Install Dependencies
        run: yarn install --immutable

      - name: Check Format
        run: yarn format:check

      - name: Lint
        run: yarn lint:check

      - name: Typecheck
        run: yarn typecheck

      - name: Test
        run: yarn ci-test

  test-action:
    name: End-to-end against a SoftEther server
    runs-on: ubuntu-latest

    services:
      vpnserver:
        image: softethervpn/vpnserver:5.2.5189
        ports:
          - 5555:5555

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # A fresh server has an empty admin password and a DEFAULT hub. SecureNAT
      # gives the hub a DHCP server and a virtual host at 192.168.30.1.
      - name: Configure Test Server
        run: |
          vpn() { docker exec ${{ job.services.vpnserver.id }} vpncmd localhost:5555 /SERVER /HUB:DEFAULT /CMD "$@"; }
          for _ in $(seq 30); do vpn HubList >/dev/null 2>&1 && break; sleep 1; done
          vpn UserCreate ci /GROUP:none /REALNAME:none /NOTE:none
          vpn UserPasswordSet ci /PASSWORD:ci-password
          vpn SecureNatEnable

      - name: Connect
        id: vpn
        uses: ./
        with:
          server: 127.0.0.1
          port: 5555
          username: ci
          password: ci-password

      - name: Reach the VPN
        run: |
          echo "Connected on ${{ steps.vpn.outputs.interface }} as ${{ steps.vpn.outputs.ip }}"
          ping -c 3 192.168.30.1
