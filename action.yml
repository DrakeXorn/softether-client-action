name: SoftEther VPN Client Action
description: A GitHub Action that runs the SoftEther VPN Client on a self-hosted runner. This action is designed to be used in workflows that require a VPN connection to access resources that are not publicly available.
author:
  name: Christophe 'DrakeXorn' Bernard

# Add your action's branding here. This will appear on the GitHub Marketplace.
branding:
  icon: server
  color: blue

# Define your inputs here.
inputs:
  milliseconds:
    description: Your input description here
    required: true
    default: '1000'

# Define your outputs here.
outputs:
  time:
    description: Your output description here

runs:
  using: node24
  main: dist/index.js
