name: SoftEther VPN Client Action
description: Connects a Linux runner to a SoftEther VPN server for the rest of the job, and disconnects in a post step.
author: Christophe 'DrakeXorn' Bernard

branding:
  icon: lock
  color: blue

inputs:
  server:
    description: Host name or IP address of the VPN server.
    required: true
  port:
    description: Port of the VPN server (e.g. 443, 992, 1194 or 5555).
    required: true
    default: "443"
  hub:
    description: Name of the Virtual Hub to connect to.
    required: false
    default: DEFAULT
  authentication_method:
    description: One of "password", "radius", "certificate" or "anonymous".
    required: false
    default: password
  username:
    description: Username. Required for every method except "anonymous".
    required: false
  password:
    description: Password, for the "password" and "radius" methods. Pass it from a secret.
    required: false
  client_cert:
    description: PEM-encoded client certificate, for the "certificate" method.
    required: false
  client_key:
    description: PEM-encoded client private key, for the "certificate" method. Pass it from a secret.
    required: false
  server_ca:
    description: PEM-encoded CA certificate used to verify the server. When empty, the server certificate is not verified.
    required: false
  send_all_traffic:
    description: Route all runner traffic through the VPN (true/false). When false, only the VPN subnet goes through it.
    required: false
    default: "false"
  timeout:
    description: Seconds to wait for the VPN session to be established.
    required: false
    default: "30"

outputs:
  interface:
    description: Name of the VPN network interface (vpn_vpn).
  ip:
    description: IPv4 address assigned to the runner on the VPN.

runs:
  using: node24
  main: dist/index.js
  post: dist/index.js
